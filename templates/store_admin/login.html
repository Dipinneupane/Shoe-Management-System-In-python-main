{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login – Happy Fit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/notifications.css' %}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 2rem;
        }
        .admin-login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 12px;
            padding: 4rem 3.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .adm-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #eff6ff;
            color: #2563eb;
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.5rem 1.4rem;
            border-radius: 20px;
            margin-bottom: 2rem;
        }
        .admin-login-card h2 {
            font-size: 2.6rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.6rem;
        }
        .admin-login-card p.subtitle {
            font-size: 1.4rem;
            color: #64748b;
            margin-bottom: 3rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 2rem;
        }
        .form-group label {
            display: block;
            font-size: 1.35rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.6rem;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 1.4rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.5rem;
        }
        .input-wrap input {
            width: 100%;
            padding: 1.3rem 1.4rem 1.3rem 4.2rem;
            font-size: 1.45rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .input-wrap input:focus {
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .adm-submit-btn {
            width: 100%;
            padding: 1.4rem;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            background: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 1rem;
        }
        .adm-submit-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.3);
        }
        .notification-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body>

    {% if messages %}
        <div class="notification-container">
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    <span>{{ message }}</span>
                    <i class="fas fa-times" onclick="this.parentElement.remove();"></i>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="admin-login-card">
        <span class="adm-badge">
            <i class="fas fa-shield-alt"></i> Staff Access Only
        </span>
        <h2>Admin Portal</h2>
        <p class="subtitle">Authenticate with your administrator credentials.</p>

        <form action="{% url 'store_admin:admin_login' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="adminEmail">Admin Email or Username</label>
                <div class="input-wrap">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="adminEmail" name="email" required placeholder="admin@gmail.com" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="adminPassword">Security Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="adminPassword" name="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="adm-submit-btn">
                <i class="fas fa-sign-in-alt"></i> Log In to Dashboard
            </button>
        </form>
    </div>

</body>
</html>
