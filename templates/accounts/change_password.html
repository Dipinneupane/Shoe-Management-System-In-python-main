{% extends 'base.html' %}

{% block title %}Change Password – Happy Fit{% endblock %}

{% block extra_css %}
<style>
.password-page {
    max-width: 680px;
    margin: 4rem auto 7rem;
    padding: 0 2rem;
}
.password-page-back {
    display: inline-flex;
    align-items: center;
    gap: .8rem;
    margin-bottom: 1.8rem;
    color: #52625f;
    font-size: 1.35rem;
}
.password-page-panel {
    padding: 3rem;
    border: 1px solid #dce5e3;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 14px 40px rgba(25, 50, 47, .07);
}
.password-page-panel h1 {
    margin-bottom: 2.4rem;
    color: #20312e;
    font-size: 2.4rem;
}
.password-page-form p { margin-bottom: 1.8rem; }
.password-page-form label {
    display: block;
    margin-bottom: .6rem;
    color: #334155;
    font-size: 1.35rem;
    font-weight: 600;
}
.password-page-form input {
    width: 100%;
    padding: 1.1rem 1.4rem;
    border: 1px solid #cbd7d4;
    border-radius: 6px;
    background: #fbfcfc;
    font-size: 1.4rem;
}
.password-page-form input:focus {
    border-color: #087f76;
    box-shadow: 0 0 0 3px rgba(8, 127, 118, .12);
}
.password-page-form ul { margin: .6rem 0 0 1.8rem; color: #64748b; font-size: 1.2rem; }
.password-page-form .errorlist { color: #b42318; }
.password-page-submit {
    padding: 1.2rem 1.8rem;
    border-radius: 6px;
    color: #fff;
    background: #193b38;
    font-size: 1.4rem;
    font-weight: 600;
    cursor: pointer;
}
.password-page-submit:hover { background: #087f76; }
@media (max-width: 600px) {
    .password-page { margin-top: 2.4rem; padding: 0 1.4rem; }
    .password-page-panel { padding: 2.2rem; }
}
</style>
{% endblock %}

{% block content %}
<main class="password-page">
    <a class="password-page-back" href="{% url 'accounts:profile' %}">
        <i class="fas fa-arrow-left"></i> Back to profile
    </a>
    <section class="password-page-panel">
        <h1>Change password</h1>
        <form class="password-page-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="password-page-submit" type="submit">Update password</button>
        </form>
    </section>
</main>
{% endblock %}
